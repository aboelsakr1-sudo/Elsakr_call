<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sakr Call - الصقر كول</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0a0e17; color: #e2e8f0; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #161e2e; padding: 20px; border-radius: 16px; width: 100%; max-width: 680px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid #1f293a; position: relative; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 26px; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #1f293a; background: #0f172a; color: #f1f5f9; font-size: 15px; }
    button { background: #0284c7; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
    button:hover { background: #0369a1; }
    
    /* التبويبات العلويّة */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid #1f293a; padding-bottom: 10px; }
    .tab-btn { background: #1f293a; color: #94a3b8; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold; text-align: center; }
    .tab-btn.active { background: #0284c7; color: #fff; }

    /* قائمة المستخدمين */
    .user-list { list-style: none; padding: 0; margin: 0; }
    .user-item { background: #1f293a; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #2d3748; flex-wrap: wrap; gap: 8px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #38bdf8; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
    .action-btns { display: flex; gap: 5px; }
    .action-btns button { padding: 6px 10px; margin: 0; font-size: 13px; width: auto; }
    
    /* تنبيه المكالمات والدردشة */
    .alert-box { background: #f59e0b; color: #000; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; text-align: center; }

    /* النافذة المرئية والفيديو */
    .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    video { width: 100%; height: 180px; background: #000; border-radius: 10px; object-fit: cover; border: 2px solid #334155; }

    /* صالة الألعاب */
    .games-container { background: #0f172a; border-radius: 12px; padding: 15px; border: 1px solid #1f293a; text-align: center; }
    .game-menu { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
    .game-menu button { background: #6d28d9; width: auto; padding: 8px 16px; }

    /* رقعة الشطرنج الرئيسية */
    .chess-board { display: grid; grid-template-columns: repeat(8, 1fr); max-width: 320px; height: 320px; margin: 10px auto; border: 3px solid #38bdf8; border-radius: 4px; }
    .chess-sq { display: flex; justify-content: center; align-items: center; font-size: 26px; cursor: pointer; user-select: none; }
    .chess-sq.white { background: #f0d9b5; color: #000; }
    .chess-sq.black { background: #b58863; color: #000; }
    .chess-sq.selected { background: #7fc97f !important; }

    /* لعبة الدومينو واللودو */
    .domino-board, .ludo-board { background: #1e293b; min-height: 200px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #a78bfa; margin-top: 10px; border: 2px dashed #4c1d95; }

    /* الدردشة النصية */
    .chat-box { background: #0f172a; border: 1px solid #1f293a; border-radius: 8px; height: 150px; overflow-y: auto; padding: 10px; margin-bottom: 8px; text-align: right; }
    .chat-msg { margin-bottom: 6px; padding: 5px 8px; background: #1f293a; border-radius: 6px; display: inline-block; clear: both; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="card">
  <h2>🦅 El Sakr Call - الصقر كول</h2>

  <!-- 1️⃣ شاشة الدخول -->
  <div id="login-screen">
    <div id="login-error-msg" style="color: #ef4444; font-weight: bold; margin-bottom: 10px; text-align: center;"></div>
    
    <input type="text" id="username" placeholder="اسم المستخدم (مثال: fathi)...">
    <input type="password" id="password" placeholder="كلمة المرور...">
    
    <label style="font-size: 13px; color: #94a3b8; display: block; text-align: right; margin-top: 5px;">صورة شخصية (اختياري):</label>
    <input type="file" id="avatar-input" accept="image/*" style="padding: 5px;">

    <select id="room-select">
      <option value="الأصدقاء">قسم الأصدقاء 👥</option>
      <option value="الأهل">قسم الأهل 🏠</option>
      <option value="العمل">قسم العمل 💼</option>
    </select>

    <button onclick="login()">دخول التطبيق 🚀</button>
  </div>

  <!-- 2️⃣ الشاشة الرئيسية للوحة التحكم -->
  <div id="main-screen" class="hidden">
    
    <!-- التبويبات -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('users-tab')">👥 المتصلون</button>
      <button class="tab-btn" onclick="switchTab('games-tab')">♟️ صالة الألعاب</button>
      <button class="tab-btn" onclick="switchTab('profile-tab')">👤 الملف الشخصي</button>
    </div>

    <!-- إشعار طلب وارد (مكالمة / دردشة) -->
    <div id="incoming-request-box" class="alert-box hidden">
      <div id="request-text"></div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
        <button onclick="acceptRequest()" style="background:#10b981; width: 100px;">قبول 🟢</button>
        <button onclick="rejectRequest()" style="background:#ef4444; width: 100px;">رفض 🔴</button>
      </div>
    </div>

    <!-- تبويب المتصلين -->
    <div id="users-tab">
      <p style="color: #94a3b8; font-size: 14px; margin-top:0;">المستخدمون النشطون في غرفة (<span id="room-display" style="color:#fff;"></span>):</p>
      <ul id="users-ul" class="user-list"></ul>
    </div>

    <!-- تبويب صالة الألعاب (متاحة دائماً) -->
    <div id="games-tab" class="hidden">
      <div class="games-container">
        <h3>🎮 صالة الألعاب التفاعلية</h3>
        <div class="game-menu">
          <button onclick="loadGame('chess')" style="background: #0284c7;">♟️ الشطرنج (أساسية)</button>
          <button onclick="loadGame('domino')">🀄 الدومينو</button>
          <button onclick="loadGame('ludo')">🎲 اللودو</button>
        </div>

        <!-- لعبة الشطرنج التفاعلية -->
        <div id="chess-view" class="game-view">
          <div style="margin-bottom: 5px; color: #38bdf8; font-weight: bold;">رقعة الشطرنج</div>
          <div id="chess-board" class="chess-board"></div>
          <button onclick="initChess()" style="background: #eab308; color:#000; width: 150px;">إعادة اللعبة 🔄</button>
        </div>

        <!-- لعبة الدومينو -->
        <div id="domino-view" class="game-view hidden">
          <div class="domino-board">🀄 طاولة الدومينو جاهزة للعب مع الأصدقاء</div>
        </div>

        <!-- لعبة اللودو -->
        <div id="ludo-view" class="game-view hidden">
          <div class="ludo-board">🎲 طاولة اللودو التفاعلية</div>
        </div>
      </div>
    </div>

    <!-- تبويب البروفايل -->
    <div id="profile-tab" class="hidden" style="text-align: center;">
      <div id="profile-avatar-preview" class="user-avatar" style="width: 80px; height: 80px; margin: 10px auto; font-size: 28px;"></div>
      <h3 id="profile-name-display" style="color: #38bdf8;"></h3>
      <p style="color: #94a3b8;">حالة الحساب: <span style="color: #10b981;">نشط الآن 🟢</span></p>
    </div>

    <!-- شاشة الاتصال / المحادثة النوافذ -->
    <div id="communication-box" class="hidden" style="margin-top: 15px; border-top: 2px solid #1f293a; padding-top: 15px;">
      
      <!-- منطقة الرسائل الكتابية -->
      <div id="chat-section" class="hidden">
        <h4 style="margin: 5px 0;">💬 المحادثة الكتابية</h4>
        <div id="chat-box" class="chat-box"></div>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." style="margin:0;">
          <button onclick="sendChatMessage()" style="width: 80px; margin:0;">إرسال</button>
        </div>
      </div>

      <!-- منطقة الصوت والفيديو -->
      <div id="media-section" class="hidden">
        <div class="video-grid">
          <video id="localVideo" autoplay playsinline muted></video>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>
      </div>

      <button onclick="closeCommunication()" style="background: #ef4444; margin-top: 10px;">إنهاء التواصل ✖</button>
    </div>

  </div>
</div>

<script>
  const socket = io();
  let currentUser = { username: '', room: '', avatar: null };
  let currentTargetSocketId = null;
  let activeRequestData = null;
  let peerConnection = null;
  let localStream = null;

  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  // 1. تسجيل الدخول والتحقق
  function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const room = document.getElementById('room-select').value;
    const avatarInput = document.getElementById('avatar-input');

    if (!username || !password) {
      alert('يرجى كتابة اسم المستخدم وكلمة المرور!');
      return;
    }

    if (avatarInput.files && avatarInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        currentUser.avatar = e.target.result;
        sendJoinEvent(username, password, room);
      };
      reader.readAsDataURL(avatarInput.files[0]);
    } else {
      sendJoinEvent(username, password, room);
    }
  }

  function sendJoinEvent(username, password, room) {
    currentUser.username = username;
    currentUser.room = room;
    socket.emit('join-room', { username, password, room, avatar: currentUser.avatar });
  }

  // خطأ الاسم المكرر
  socket.on('login-error', (msg) => {
    document.getElementById('login-error-msg').innerText = msg;
  });

  // نجاح الدخول
  socket.on('login-success', ({ username, room }) => {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('main-screen').classList.remove('hidden');
    document.getElementById('room-display').innerText = room;
    
    // إعداد البروفايل
    document.getElementById('profile-name-display').innerText = username;
    const avatarBox = document.getElementById('profile-avatar-preview');
    if (currentUser.avatar) {
      avatarBox.innerHTML = `<img src="${currentUser.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
    } else {
      avatarBox.innerText = username.charAt(0).toUpperCase();
    }

    initChess(); // تجهيز الشطرنج
  });

  // 2. تحديث قائمة المستخدمين
  socket.on('room-users', (users) => {
    const ul = document.getElementById('users-ul');
    ul.innerHTML = '';

    const others = users.filter(u => u.socketId !== socket.id);

    if (others.length === 0) {
      ul.innerHTML = `<li style="text-align:center; color:#94a3b8; padding:15px;">لا يوجد مستخدمون آخرون في الغرفة حالياً.</li>`;
      return;
    }

    others.forEach(u => {
      const li = document.createElement('li');
      li.className = 'user-item';

      const avatarHTML = u.avatar 
        ? `<img src="${u.avatar}" class="user-avatar">`
        : `<div class="user-avatar">${u.username.charAt(0).toUpperCase()}</div>`;

      li.innerHTML = `
        <div class="user-info">
          ${avatarHTML}
          <span style="font-weight:bold;">${u.username}</span>
        </div>
        <div class="action-btns">
          <button onclick="requestComm('${u.socketId}', 'chat')" style="background:#0284c7;">💬 دردشة</button>
          <button onclick="requestComm('${u.socketId}', 'voice')" style="background:#059669;">🎙️ صوت</button>
          <button onclick="requestComm('${u.socketId}', 'video')" style="background:#7c3aed;">📹 فيديو</button>
        </div>
      `;
      ul.appendChild(li);
    });
  });

  // 3. إرسال طلب تواصل (دردشة / صوت / فيديو)
  async function requestComm(targetSocketId, type) {
    currentTargetSocketId = targetSocketId;

    if (type === 'voice' || type === 'video') {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: type === 'video',
          audio: true
        });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (e) {
        alert('يرجى السماح بالوصول للميكروفون/الكاميرا');
        return;
      }
    }

    alert('تم إرسال الطلب، بانتظار موافقة الطرف الآخر...');
    socket.emit('request-communication', { targetSocketId, type });
  }

  // 4. استقبال طلب وارد
  socket.on('incoming-request', ({ fromSocketId, callerName, type, signalData }) => {
    currentTargetSocketId = fromSocketId;
    activeRequestData = { fromSocketId, type, signalData };

    const typeNames = { chat: 'دردشة كتابية 💬', voice: 'مكالمة صوتية 🎙️', video: 'مكالمة فيديو 📹' };
    document.getElementById('request-text').innerText = `طلب من (${callerName}): ${typeNames[type]}`;
    document.getElementById('incoming-request-box').classList.remove('hidden');
  });

  async function acceptRequest() {
    document.getElementById('incoming-request-box').classList.add('hidden');
    const { fromSocketId, type } = activeRequestData;

    showCommBox(type);

    if (type === 'voice' || type === 'video') {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: type === 'video',
        audio: true
      });
      document.getElementById('localVideo').srcObject = localStream;

      peerConnection = createPeer(fromSocketId);
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      socket.emit('accept-request', { targetSocketId: fromSocketId, signalData: offer, type });
    } else {
      socket.emit('accept-request', { targetSocketId: fromSocketId, type });
    }
  }

  function rejectRequest() {
    document.getElementById('incoming-request-box').classList.add('hidden');
    socket.emit('reject-request', { targetSocketId: activeRequestData.fromSocketId });
  }

  socket.on('request-rejected', () => {
    alert('تم رفض الطلب من الطرف الآخر.');
  });

  socket.on('request-accepted', async ({ fromSocketId, signalData, type }) => {
    showCommBox(type);
    if (signalData && peerConnection) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(signalData));
    }
  });

  function showCommBox(type) {
    document.getElementById('communication-box').classList.remove('hidden');
    if (type === 'chat') {
      document.getElementById('chat-section').classList.remove('hidden');
      document.getElementById('media-section').classList.add('hidden');
    } else {
      document.getElementById('media-section').classList.remove('hidden');
      document.getElementById('chat-section').classList.add('hidden');
    }
  }

  function closeCommunication() {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (peerConnection) peerConnection.close();
    document.getElementById('communication-box').classList.add('hidden');
  }

  function createPeer(targetSocketId) {
    const pc = new RTCPeerConnection(rtcConfig);
    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }
    pc.ontrack = (e) => {
      document.getElementById('remoteVideo').srcObject = e.streams[0];
    };
    return pc;
  }

  // الرسائل النصية
  function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message || !currentTargetSocketId) return;

    socket.emit('send-chat-msg', { targetSocketId: currentTargetSocketId, message });
    appendMsg(`أنت: ${message}`);
    input.value = '';
  }

  socket.on('receive-chat-msg', ({ senderName, message }) => {
    appendMsg(`${senderName}: ${message}`);
  });

  function appendMsg(text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  // التنقل بين التبويبات
  function switchTab(tabId) {
    document.querySelectorAll('.nav-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    document.getElementById('users-tab').classList.add('hidden');
    document.getElementById('games-tab').classList.add('hidden');
    document.getElementById('profile-tab').classList.add('hidden');

    document.getElementById(tabId).classList.remove('hidden');
  }

  function loadGame(game) {
    document.getElementById('chess-view').classList.add('hidden');
    document.getElementById('domino-view').classList.add('hidden');
    document.getElementById('ludo-view').classList.add('hidden');

    document.getElementById(`${game}-view`).classList.remove('hidden');
  }

  // --- ♟️ كود لعبة الشطرنج التفاعلية ---
  const initialChessBoard = [
    ['♜','♞','♝','♛','♚','♝','♞','♜'],
    ['♟','♟','♟','♟','♟','♟','♟','♟'],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['♙','♙','♙','♙','♙','♙','♙','♙'],
    ['♖','♘','♗','♕','♔','♗','♘','♖']
  ];
  let currentChessState = [];
  let selectedSquare = null;

  function initChess() {
    currentChessState = JSON.parse(JSON.stringify(initialChessBoard));
    renderChessBoard();
  }

  function renderChessBoard() {
    const boardEl = document.getElementById('chess-board');
    boardEl.innerHTML = '';
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const sq = document.createElement('div');
        const isWhite = (r + c) % 2 === 0;
        sq.className = `chess-sq ${isWhite ? 'white' : 'black'}`;
        sq.innerText = currentChessState[r][c];
        
        if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
          sq.classList.add('selected');
        }

        sq.onclick = () => handleChessClick(r, c);
        boardEl.appendChild(sq);
      }
    }
  }

  function handleChessClick(r, c) {
    if (selectedSquare) {
      // نقل القطعة
      currentChessState[r][c] = currentChessState[selectedSquare.r][selectedSquare.c];
      currentChessState[selectedSquare.r][selectedSquare.c] = '';
      selectedSquare = null;
    } else {
      // تحديد القطعة
      if (currentChessState[r][c] !== '') {
        selectedSquare = { r, c };
      }
    }
    renderChessBoard();
  }
</script>
</body>
</html>
