<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sakr Call</title>
    <meta name="author"content="Fathi sakr">
    <meta name="robots"content="index,follow">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h2 { margin-bottom: 20px; color: #38bdf8; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; }
    button { background: #0284c7; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #0369a1; }
    .user-list { list-style: none; padding: 0; margin-top: 15px; text-align: right; }
    .user-item { background: #334155; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .user-item button { width: auto; padding: 6px 15px; margin: 0; background: #10b981; }
    .video-container { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    video { width: 100%; height: 200px; background: #000; border-radius: 12px; object-fit: cover; }
    .hidden { display: none; }
    .incoming-alert { background: #eab308; color: #000; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
    .incoming-alert button { margin-top: 5px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🦅 El Sakr Call</h2>

  <!-- شاشة الدخول -->
  <div id="login-screen">
    <input type="text" id="username" placeholder="أدخل اسمك (مثال: محمد)...">
    <select id="room-select">
      <option value="الأصدقاء">قسم الأصدقاء 👥</option>
      <option value="الأهل">قسم الأهل 🏠</option>
      <option value="العمل">قسم العمل 💼</option>
    </select>
    <button onclick="joinRoom()">دخول الغرفة</button>
  </div>

  <!-- الشاشة الرئيسية بعد الدخول -->
  <div id="main-screen" class="hidden">
    <h3 id="welcome-msg" style="color: #38bdf8;"></h3>
    <p>المتواجدون حالياً في قسم (<span id="current-room-name"></span>):</p>
    
    <!-- إشعار مكالمة واردة -->
    <div id="incoming-call-box" class="incoming-alert hidden">
      <span id="caller-name"></span> يتصل بك...
      <button onclick="acceptCall()" style="background:#10b981;">رد على المكالمة 📞</button>
      <button onclick="rejectCall()" style="background:#ef4444;">رفض ❌</button>
    </div>

    <ul id="users-ul" class="user-list"></ul>

    <!-- شاشة الفيديوهات -->
    <div id="video-box" class="video-container hidden">
      <video id="localVideo" autoplay playsinline muted></video>
      <video id="remoteVideo" autoplay playsinline></video>
      <button onclick="endCall()" style="background: #ef4444;">إنهاء المكالمة 🔇</button>
    </div>
  </div>
</div>

<script>
  const socket = io();
  let localStream;
  let peerConnection;
  let currentTargetSocketId = null;
  let incomingCallerSignal = null;

  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  async function joinRoom() {
    const username = document.getElementById('username').value.trim();
    const room = document.getElementById('room-select').value;

    if (!username) return alert('برجاء كتابة اسمك أولاً!');

    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('main-screen').classList.remove('hidden');
    document.getElementById('welcome-msg').innerText = `أهلاً بك يا ${username}`;
    document.getElementById('current-room-name').innerText = room;

    // تشغيل الكاميرا المباشرة
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('localVideo').srcObject = localStream;
    } catch (e) {
      console.warn('لم يتم العثور على كاميرا أو مايك:', e);
    }

    socket.emit('join-room', { username, room });
  }

  // استقبال قائمة المتواجدين
  socket.on('room-users', (users) => {
    const ul = document.getElementById('users-ul');
    ul.innerHTML = '';

    users.forEach(u => {
      if (u.socketId !== socket.id) {
        const li = document.createElement('li');
        li.className = 'user-item';
        li.innerHTML = `
          <span>👤 ${u.username}</span>
          <button onclick="startCall('${u.socketId}')">اتصال خاص 📞</button>
        `;
        ul.appendChild(li);
      }
    });

    if (ul.children.length === 0) {
      ul.innerHTML = '<li style="text-align:center; color:#94a3b8;">لا يوجد أحد في الغرفة حالياً</li>';
    }
  });

  // بدء اتصال فردي خاص
  async function startCall(targetSocketId) {
    currentTargetSocketId = targetSocketId;
    document.getElementById('video-box').classList.remove('hidden');

    peerConnection = createPeerConnection(targetSocketId);
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    socket.emit('call-user', { targetSocketId, signalData: offer });
  }

  // استقبال اتصال فريد من شخص آخر
  socket.on('incoming-call', ({ fromSocketId, callerName, signalData }) => {
    currentTargetSocketId = fromSocketId;
    incomingCallerSignal = signalData;

    document.getElementById('caller-name').innerText = callerName;
    document.getElementById('incoming-call-box').classList.remove('hidden');
  });

  // القبول على المكالمة الواردة
  async function acceptCall() {
    document.getElementById('incoming-call-box').classList.add('hidden');
    document.getElementById('video-box').classList.remove('hidden');

    peerConnection = createPeerConnection(currentTargetSocketId);
    await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingCallerSignal));

    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    socket.emit('accept-call', { targetSocketId: currentTargetSocketId, signalData: answer });
  }

  // الطرف الآخر قبل المكالمة
  socket.on('call-accepted', async ({ signalData }) => {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(signalData));
  });

  function rejectCall() {
    document.getElementById('incoming-call-box').classList.add('hidden');
    socket.emit('reject-call', { targetSocketId: currentTargetSocketId });
  }

  socket.on('call-rejected', () => {
    alert('تم رفض المكالمة من الطرف الآخر');
    endCall();
  });

  function createPeerConnection(targetSocketId) {
    const pc = new RTCPeerConnection(rtcConfig);

    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    pc.ontrack = (event) => {
      document.getElementById('remoteVideo').srcObject = event.streams[0];
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        // يتم النقل تلقائياً عبر signaling
      }
    };

    return pc;
  }

  function endCall() {
    if (peerConnection) peerConnection.close();
    document.getElementById('video-box').classList.add('hidden');
  }
</script>

</body>
</html>
